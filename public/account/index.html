<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Your account — Legado Locker</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin/admin.css"><link rel="stylesheet" href="/account/account.css"><script type="module" src="/account/account.js"></script></head><body><header><a class="wordmark" href="/">LEGADO LOCKER</a><nav><a href="/#collection">Shop ↗</a><button id="signout" hidden>Sign out</button></nav></header><main class="admin-main account-main"><p class="eyebrow">YOUR STORY / YOUR LEGACY</p><h1>YOUR LOCKER.</h1><p id="account-message" role="status"></p><section id="link-panel" hidden><h2 id="link-heading"></h2><form id="link-form"><div id="reset-field" hidden><label for="new-password">New password (12+ characters)</label><input id="new-password" type="password" minlength="12" maxlength="256" autocomplete="new-password"></div><button class="button" id="link-submit" type="submit">Continue</button></form></section><section id="auth-panel"><div class="auth-tabs"><button data-mode="login">Sign in</button><button data-mode="register">Create account</button></div><form id="auth-form"><div id="name-field" hidden><label for="customer-name">Your name</label><input id="customer-name" autocomplete="name" maxlength="100"></div><label for="customer-email">Email</label><input id="customer-email" type="email" autocomplete="email" required maxlength="254"><label for="customer-password">Password</label><input id="customer-password" type="password" autocomplete="current-password" required maxlength="256"><label id="consent-field" class="checkbox" hidden><input id="marketing-consent" type="checkbox">Email me new drops, offers, and discounts. I can unsubscribe anytime.</label><p id="signup-note" class="help" hidden>We’ll email you a verification link before you can sign in. Marketing emails are optional.</p><button class="button" i

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legado Locker</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#ddd;font-family:Arial,sans-serif}header{position:absolute;z-index:5;top:0;width:100%;padding:25px 5%;display:flex;align-items:center;justify-content:space-between}header img{width:165px;mix-blend-mode:screen}nav{display:flex;gap:25px}button{cursor:pointer}nav button,.back{border:0;background:none;color:#ddd;text-transform:uppercase;letter-spacing:3px;font-size:12px}.hero{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at center,#292522 0%,#080808 70%)}.scene{width:min(540px,80vw);height:min(750px,80vh);position:relative;perspective:1200px;filter:drop-shadow(0 20px 35px #000)}.locker{height:100%;position:relative;border:12px solid #2c2926;border-radius:5px;background:repeating-linear-gradient(90deg,#181817,#292723 4px,#171716 7px);box-shadow:inset 0 0 75px #000,0 0 0 2px #595049}.inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b8176;letter-spacing:5px;text-align:center;font-size:13px}.door{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.2,.7,.1,1);background:radial-gradient(ellipse at 65% 32%,transparent 20%,#0b0907a6 100%),repeating-linear-gradient(100deg,transparent 0 31px,#a35b3225 33px 39px,transparent 45px 90px),linear-gradient(100deg,#272825,#5b4d3d 18%,#393934 42%,#69513b 72%,#252422);border:4px solid #635747;box-shadow:inset 9px 0 17px #aaa3,inset -16px 0 25px #0009,14px 12px 20px #0009;display:flex;align-items:center;justify-content:center}.door:before,.door:after{content:'';position:absolute;left:36%;right:36%;height:8px;border-top:3px solid #100f0e;border-bottom:2px solid #8b7b65;box-shadow:0 9px 0 #1b1a18,0 12px 0 #8b7b65}.door:before{top:12%}.door:after{bottom:12%}.paint{width:90%;transform:rotate(-5deg);filter:grayscale(1) contrast(1.8) brightness(1.65) drop-shadow(2px 3px 1px #000);opacity:.83;mix-blend-mode:screen}.handle{position:absolute;right:7%;top:48%;width:18px;height:80px;border-radius:4px;background:linear-gradient(90deg,#171716,#a59a88,#252525);box-shadow:2px 3px 8px #000}.open .door{transform:rotateY(-108deg)}.cta{position:absolute;z-index:3;bottom:5%;left:50%;transform:translateX(-50%);border:1px solid #b4a18a;background:#100e0cdd;color:#eee;padding:15px 36px;letter-spacing:5px;text-transform:uppercase;white-space:nowrap}.eyebrow{position:absolute;top:17%;left:50%;transform:translateX(-50%);white-space:nowrap;color:#b7a797;letter-spacing:6px;font-size:11px}.shop{display:none;min-height:100vh;padding:140px 8% 80px;background:linear-gradient(#151513,#080808)}.shop.visible{display:block}.hero.hidden{display:none}.shop h1{font-family:Georgia,serif;letter-spacing:8px;font-size:clamp(38px,7vw,80px);font-weight:normal;margin:10px 0}.shop p{color:#a49b90;letter-spacing:2px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:55px}.product{border:1px solid #4b443b;background:linear-gradient(145deg,#272622,#111);padding:24px;min-height:260px;display:flex;flex-direction:column;justify-content:end}.product .symbol{font-size:70px;text-align:center;flex:1;display:grid;place-items:center;color:#8f8170}.product h3{letter-spacing:3px;text-transform:uppercase;font-weight:400}.product small{color:#9b9083}.footer{margin-top:65px;color:#736d65;font-size:12px;letter-spacing:2px}@media(max-width:600px){header{padding:20px}header img{width:125px}nav{gap:12px}nav button{font-size:10px;letter-spacing:1px}.scene{height:68vh;width:85vw}.eyebrow{top:13%}}
</style></head><body><header><img src="logo.jpg" alt="Legado Locker"><nav><button onclick="showHome()">Home</button><button onclick="openLocker()">Shop</button><button onclick="openLocker()">Collections</button></nav></header><main id="home" class="hero"><div class="eyebrow">THE LEGACY LIVES INSIDE</div><div class="scene"><div class="locker"><div class="inside">WELCOME TO<br>LEGADO LOCKER</div><div id="door" class="door"><img class="paint" src="logo.jpg" alt="Legado Locker spray painted logo"><div class="handle"></div></div></div></div><button class="cta" onclick="openLocker()">Open the locker →</button></main><section id="shop" class="shop"><button class="back" onclick="showHome()">← Close locker</button><p>BUILT ON LEGACY · MADE TO LAST</p><h1>THE LOCKER</h1><p>Explore the collection. Your story starts here.</p><div class="products"><article class="product"><div class="symbol">✦</div><h3>Collection 01</h3><small>Coming soon</small></article><article class="product"><div class="symbol">Ⅱ</div><h3>Collection 02</h3><small>Coming soon</small></article><article class="product"><div class="symbol">✧</div><h3>Collection 03</h3><small>Coming soon</small></article></div><div class="footer">LEGADO LOCKER © 2026 — FORGED IN LEGACY</div></section><script>function openLocker(){document.querySelector('.scene').classList.add('open');setTimeout(()=>{document.getElementById('home').classList.add('hidden');document.getElementById('shop').classList.add('visible');window.scrollTo(0,0)},1000)}function showHome(){document.getElementById('shop').classList.remove('visible');document.getElementById('home').classList.remove('hidden');document.querySelector('.scene').classList.remove('open');window.scrollTo(0,0)}</script></body></html>
